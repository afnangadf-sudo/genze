services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: genze
      POSTGRES_PASSWORD: genze
      POSTGRES_DB: genze
    ports:
      - "5432:5432"
    volumes:
      - genze_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genze"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - genze_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  genze_pgdata:
  genze_redisdata:
